spring:
  application:
    name: caisora

  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caisora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

caisora:
  referencias:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    ibge-url: ${IBGE_URL:https://servicodados.ibge.gov.br}
    brasilapi-url: ${BRASILAPI_URL:https://brasilapi.com.br}
    worldtides-url: ${WORLDTIDES_URL:https://www.worldtides.info}
    worldtides-key: ${WORLDTIDES_API_KEY:}
    worldtides-habilitado: ${WORLDTIDES_ENABLED:false}
    worldtides-uso-autorizado: ${WORLDTIDES_USE_AUTHORIZED:false}
  open-meteo:
    habilitado: ${OPEN_METEO_ENABLED:false}
    weather-url: ${OPEN_METEO_WEATHER_URL:https://api.open-meteo.com}
    marine-url: ${OPEN_METEO_MARINE_URL:https://marine-api.open-meteo.com}
    api-key: ${OPEN_METEO_API_KEY:}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
  seguranca:
    jwt:
      segredo: ${JWT_SECRET:}
      expiracao-segundos: ${JWT_EXPIRATION_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
